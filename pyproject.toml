[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projective"
version = "0.0.1"
authors = [
  { name="Ryuto Yoshida"},
]
description = "Utilities for projective geometry: epipolar constraints and 2D perspective transforms (affine / homography)."
readme = "src/projective/README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "opencv-utility @ git+https://github.com/ry-yoshida-dev/OpenCVUtility.git",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida-dev/Projective"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/Projective/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projective = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
